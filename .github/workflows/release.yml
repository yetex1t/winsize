name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Qt 5.15.2 with MinGW 8.1.0
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw81'

    - name: Setup CMake 3.31.6
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.6'

    - name: Configure CMake
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Deploy Qt and MinGW runtime DLLs
      run: windeployqt out/x64-Release/winsize.exe

    - name: Strip unused artifacts
      shell: pwsh
      run: |
        $files = @(
          'out/x64-Release/libwinman.dll.a',
          'out/x64-Release/Qt5Svg.dll',
          'out/x64-Release/libEGL.dll',
          'out/x64-Release/libGLESv2.dll',
          'out/x64-Release/D3Dcompiler_47.dll',
          'out/x64-Release/opengl32sw.dll'
        )
        $dirs = @(
          'out/x64-Release/iconengines',
          'out/x64-Release/imageformats'
        )
        $files | Remove-Item -Force -ErrorAction SilentlyContinue
        $dirs | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem out/x64-Release/translations -Filter *.qm | Where-Object { $_.Name -ne 'winsize_zh_CN.qm' } | Remove-Item -Force

    - name: Package artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path _package/winsize -Force
        Copy-Item -Path out/x64-Release/* -Destination _package/winsize -Recurse
        Compress-Archive -Path _package/winsize -DestinationPath winsize-${{ github.ref_name }}.zip

    - name: Extract changelog
      id: changelog
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $lines = Get-Content CHANGELOG.md
        $inSection = $false
        "## Release Notes", "" | Out-File -FilePath release_body.md -Encoding utf8
        foreach ($line in $lines) {
          if ($line -match "^## \[$version\]") { $inSection = $true; continue }
          if ($inSection -and ($line -match "^## \[")) { break }
          if ($inSection) { $line | Out-File -FilePath release_body.md -Encoding utf8 -Append }
        }

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: |
        gh release create "${{ github.ref_name }}" `
          --title "WinSize ${{ github.ref_name }}" `
          --notes-file release_body.md `
          "winsize-${{ github.ref_name }}.zip"